<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partecipa · Capitolo 16</title>
<style>
:root{--paper:#f4f5f9;--card:#fff;--ink:#16203a;--muted:#5a6380;--line:#dde1ec;--cobalt:#2f56d9;--cobalt-soft:#e6ecff;--saffron:#f0a12f;--ok:#1f8f6b;--ok-soft:#e1f5ed;--bad:#c93a4c;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",-apple-system,"Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45}
header{background:var(--ink);color:#fff;padding:14px 18px;font-weight:700;display:flex;gap:10px;align-items:center}
header b{background:var(--saffron);color:var(--ink);border-radius:7px;padding:1px 8px}
main{padding:18px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
h1{font-size:23px;line-height:1.25;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;font:inherit;font-weight:700;color:var(--ink)}
.opt.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.opt .l{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;margin-right:10px;font-size:16px}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}
textarea:focus,.opt:focus-visible,button:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.send{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--cobalt);color:#fff;margin-top:10px}
.send:disabled{opacity:.5}
.msg{margin-top:12px;padding:12px;border-radius:10px;font-weight:700;display:none}
.msg.ok{display:block;background:var(--ok-soft);color:#11573f}
.msg.err{display:block;background:#fde8eb;color:var(--bad)}
.work{background:#fff2dc;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:16px}
.rungs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.rungs button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px;font:inherit;font-size:15px;font-weight:700;color:var(--ink)}
.rungs button.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.wait{text-align:center;padding:40px 10px;color:var(--muted)}
.wait .dot{width:14px;height:14px;border-radius:50%;background:var(--cobalt);margin:0 auto 14px;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
small{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.wait .dot{animation:none}}
</style>
</head>
<body>
<header><b>16</b> E-portfolio, feedback, open badge</header>
<main id="app"><div class="wait"><div class="dot"></div>Collegamento…</div></main>
<script>
(function(){
  let voter="";
  try{voter=localStorage.getItem("cap16-voter")||"";if(!voter){voter=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("cap16-voter",voter)}}
  catch(e){voter=Math.random().toString(36).slice(2)}
  const app=document.getElementById("app");
  let shownKey="",typing=false,rung=null;

  function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
  async function post(path,body){
    const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({v:voter},body))});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Errore, riprova");return j;
  }
  function msg(el,ok,t){el.className="msg "+(ok?"ok":"err");el.textContent=t}

  function render(s){
    const a=s.open;
    if(!a){shownKey="";app.innerHTML='<div class="wait"><div class="dot"></div><b>Sei collegato.</b><br>Aspetta la prossima domanda dal proiettore.</div>';return}
    const key=a.id+"|"+(s.mine.vote??"")+"|"+s.mine.sent;
    if(key===shownKey||typing)return;
    shownKey=key;
    let h='<div class="card"><h1>'+esc(a.title)+'</h1>';
    if(a.type==="poll"||a.type==="quiz"){
      a.options.forEach((o,i)=>{h+='<button class="opt'+(s.mine.vote===i?" sel":"")+'" data-i="'+i+'">'+(a.type==="quiz"?'<span class="l">'+"ABC"[i]+'</span>':"")+esc(o)+'</button>'});
      h+='<div class="msg'+(s.mine.vote!=null?" ok":"")+'" id="m">'+(s.mine.vote!=null?"Risposta inviata ✓ Puoi cambiarla finché la domanda è aperta.":"")+'</div>';
    }else{
      if(a.work)h+='<div class="work"><b>Il lavoro:</b> '+esc(a.work)+'</div>';
      if(a.type!=="text"){h+='<p style="margin:0 0 8px"><small>'+(a.type==="omp"?"A cosa rispondi?":"Scegli il gradino")+'</small></p><div class="rungs">';a.options.forEach((o,i)=>{h+='<button data-r="'+i+'"'+(rung===i?' class="sel"':'')+'>'+(i+1)+'. '+esc(o)+'</button>'});h+='</div>'}
      h+='<textarea id="t" maxlength="280" placeholder="'+esc(a.placeholder||"Scrivi qui…")+'"></textarea><button class="send" id="s">Invia</button>';
      h+='<div class="msg'+(s.mine.sent?" ok":"")+'" id="m">'+(s.mine.sent?"Inviate: "+s.mine.sent+". Puoi aggiungerne un'altra.":"")+'</div>';
    }
    h+='</div>';app.innerHTML=h;
    const m=document.getElementById("m");
    app.querySelectorAll("[data-i]").forEach(b=>b.onclick=async()=>{
      try{await post("/api/vote",{act:a.id,opt:+b.dataset.i});app.querySelectorAll("[data-i]").forEach(x=>x.classList.toggle("sel",x===b));msg(m,true,"Risposta inviata ✓ Puoi cambiarla finché la domanda è aperta.")}
      catch(e){msg(m,false,e.message)}
    });
    app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{rung=+b.dataset.r;app.querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("sel",x===b))});
    const t=document.getElementById("t"),sb=document.getElementById("s");
    if(t){
      t.onfocus=()=>typing=true;t.onblur=()=>setTimeout(()=>typing=false,300);
      sb.onclick=async()=>{
        if(!t.value.trim())return msg(m,false,"Scrivi qualcosa prima di inviare.");
        if(a.type!=="text"&&rung==null)return msg(m,false,a.type==="omp"?"Scegli a quale domanda rispondi.":"Scegli il gradino della scala.");
        sb.disabled=true;
        try{await post("/api/text",{act:a.id,text:t.value,rung});t.value="";typing=false;shownKey="";msg(m,true,"Inviata ✓");poll()}
        catch(e){msg(m,false,e.message)}
        sb.disabled=false;
      };
    }
  }
  let lastAct=null;
  async function poll(){
    try{
      const r=await fetch("/api/state?v="+encodeURIComponent(voter),{cache:"no-store"});const s=await r.json();
      const id=s.open&&s.open.id;if(id!==lastAct){lastAct=id;rung=null;typing=false;shownKey=""}
      render(s);
    }catch(e){if(!shownKey)app.innerHTML='<div class="wait"><div class="dot"></div>Connessione persa, riprovo…</div>'}
  }
  poll();setInterval(poll,1500);
})();
</script>
</body>
</html>
